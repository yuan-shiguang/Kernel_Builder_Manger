name: Build

# ---------------------------------------------------------------------------
# 为什么用 ubuntu-22.04 而不是 20.04
#   Tauri 2 强制依赖 webkit2gtk-4.1，Ubuntu 20.04 官方源没有这个包
#   （focal 只有 4.0；backports/PPA 都没有；借 jammy 的 deb 又会因
#   GLIBC_2.35 vs 2.31 而无法加载）。22.04 自带 libwebkit2gtk-4.1-dev，
#   所以直接在 22.04 runner 上构建，省掉整套自编译。
#
# 产出的 .deb / .AppImage 在 20.04 上能否运行？
#   不能直接跑：它们依赖 webkit2gtk-4.1，而 20.04 没有这个运行库。
#   本工作流的定位是「在云端编译出可分发产物」，面向 22.04+ 用户。
# ---------------------------------------------------------------------------

on:
  # 手动触发：仓库页面 Actions -> Build -> Run workflow
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签；留空则只构建产物、不创建 Release（例如 v0.1.0）'
        required: false
        default: ''
      bundles:
        description: '打包格式'
        required: true
        default: 'deb,appimage'
        type: choice
        options:
          - deb,appimage
          - deb,appimage,rpm
          - deb
          - appimage

  # 推送 v* 标签时自动构建并创建 Release（草稿状态）
  push:
    tags:
      - 'v*'

  # PR 只做构建验证，不发布
  pull_request:
    branches: [main, master]

# 同一分支/标签的重复构建自动取消，避免浪费
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux 构建（deb / AppImage）
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 创建 Release 需要

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf \
            rpm

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci

      - name: 前端类型检查（不阻断构建）
        run: npm run type-check
        continue-on-error: true

      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 非空时才创建 Release：推标签走 ref 名，手动触发走输入框
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          releaseName: "Kernel Builder Manager ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          releaseBody: |
            Linux 构建产物：

            - `*.deb` —— Debian / Ubuntu 22.04+ 安装包
            - `*.AppImage` —— 免安装，`chmod +x` 后直接运行

            > 需要 webkit2gtk-4.1 运行库，适用于 Ubuntu 22.04 及以上。
          releaseDraft: true
          prerelease: false
          args: "--bundles ${{ github.event_name == 'workflow_dispatch' && inputs.bundles || 'deb,appimage' }}"

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: kernel-builder-manager-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 14
